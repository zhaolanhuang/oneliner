[package]
edition = "2024"
name = "embassy-qemu-lm3s-minimal"
version = "0.1.0"
authors = ["Zhaolan Huang <zhaolan94@gmail.com>"]
resolver = "2"
publish = false

[[bin]]
name = "embassy-qemu-lm3s-minimal"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
oneliner = { path = "../../oneliner" }
static_cell = "2.1.1"

[profile.release]
debug = 2
lto = true
opt-level = "z"

[profile.dev]
debug = 2
lto = true
opt-level = "z"
