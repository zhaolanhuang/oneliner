[package]
name = "qemu-vmcu-mcunet"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "qemu-vmcu-mcunet"
test = false
bench = false

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
oneliner = { path = "../../oneliner" }
static_cell = "2.1.1"

[features]
default = []
standard = []

[profile.release]
debug = 2
lto = true
opt-level = "z"
codegen-units = 1
